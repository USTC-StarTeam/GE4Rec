    debug_mode: False
    group_id: null
    use_features: null
    feature_specs: null
    feature_config: null

FM_test:
    model: FM
    dataset_id: tiny_npz
    loss: binary_crossentropy
    metrics: ['logloss', 'AUC']
    task: binary_classification
    optimizer: adam
    learning_rate: 1.0e-3
    regularizer: 1.e-8
    batch_size: 128
    embedding_dim: 4
    epochs: 3
    shuffle: True
    seed: 2019
    monitor: 'AUC'
    monitor_mode: 'max'
    use_fs: false
    linear_fs: false
    emb_activation: linear
    symmetric: false
    concat_emb: false
    gamma: 1

